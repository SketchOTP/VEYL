name: Linux checks and packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.20.0
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci
      - name: Syntax
        run: npm run check
      - name: Tests (fixtures only; no provider inference)
        run: npm test
      - name: Build Linux x64 packages (never publish)
        run: npm run dist:linux
      - name: Verify packaged file allowlist and manifest
        run: npm run verify:package
      - name: Store packages only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: VEYL-linux-x64
          path: |
            dist/*.deb
            dist/*.tar.gz
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          retention-days: 7
